<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
    <title>404 - Lost in space | Nacriema</title>

    <!-- <link rel="stylesheet" type="text/css" href="styles.css" /> -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" />

    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        background: #0b0f17;
        scrollbar-color: #2c3850 #0b0f17;
      }

      html::-webkit-scrollbar { width: 10px; }
      html::-webkit-scrollbar-track { background: #0b0f17; }
      html::-webkit-scrollbar-thumb { background: #2c3850; border-radius: 10px; border: 2px solid #0b0f17; }
      html::-webkit-scrollbar-thumb:hover { background: #b392f0; }

      body {
        min-height: 100vh;
        background:
          radial-gradient(ellipse 80% 50% at 15% -10%, rgba(179, 146, 240, 0.18), transparent 60%),
          linear-gradient(rgba(11, 15, 23, 0.72), rgba(11, 15, 23, 0.92)),
          url("/assets/img/star.jpg") center center / cover #0b0f17;
        color: #d7dfeb;
        font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        overflow-x: hidden;
      }

      .stage {
        width: 512px;
        max-width: 100%;
        margin: 60px auto 0;
        overflow: visible;
      }

      #astronaut {
        width: 512px;
        height: 512px;
        background: url("/assets/img/astronaut.png") no-repeat;
        position: relative;
        transform-origin: top left;
      }

      @media (max-width: 560px) {
        .stage { width: 300px; height: 300px; margin-top: 40px; }
        #astronaut { transform: scale(0.585); }
      }

      /*	Two steam classes. */
      .steam1,
      .steam2 {
        position: absolute;
        bottom: 78px;
        left: 300px;
        width: 120px;
        height: 120px;
        background: url("/assets/img/steam.png") no-repeat;
        opacity: 0.8;
      }

      .steam2 {
        background-position: left bottom;
      }

      .term {
        width: min(640px, calc(100vw - 32px));
        margin: 8px auto 48px;
        background: rgba(10, 14, 20, 0.9);
        border: 1px solid #243044;
        border-radius: 10px;
        box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9);
        overflow: hidden;
        font-family: "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.7;
      }

      .term-bar {
        height: 34px;
        line-height: 34px;
        text-align: center;
        font-size: 12px;
        color: #8a97ad;
        background:
          radial-gradient(circle at 18px 17px, #ff5f56 5px, transparent 6px),
          radial-gradient(circle at 36px 17px, #ffbd2e 5px, transparent 6px),
          radial-gradient(circle at 54px 17px, #27c93f 5px, transparent 6px),
          #141b28;
        border-bottom: 1px solid #243044;
      }

      .term-body {
        padding: 16px 20px 18px;
      }

      .term-body p {
        overflow-wrap: anywhere;
      }

      .ps1 { color: #7ee787; font-weight: 700; }
      .err { color: #ff7b72; }
      .muted { color: #8a97ad; }
      .big {
        font-family: "Inter", sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: #f3f6fb;
        margin: 12px 0 8px;
      }

      @media (max-width: 560px) {
        .big { font-size: 32px; }
        .term { font-size: 13px; }
      }

      a,
      a:visited {
        color: #7ee787;
        text-decoration: none;
        border-bottom: 1px dashed rgba(126, 231, 135, 0.5);
      }

      a:hover {
        border-bottom-style: solid;
      }

      .cursor {
        display: inline-block;
        width: 0.6em;
        height: 1.1em;
        vertical-align: -0.2em;
        margin-left: 0.3em;
        background: #7ee787;
        animation: blink 1.1s steps(1) infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </head>

  <body>
    <div class="stage"><div id="astronaut"></div></div>

    <div class="term" role="main">
      <div class="term-bar">nacriema@space: ~</div>
      <div class="term-body">
        <p><span class="ps1">$</span> cd <span id="req-path">/this-page</span></p>
        <p class="err">bash: cd: <span id="req-path-2">/this-page</span>: No such file or directory</p>
        <p class="big">404 &mdash; Lost in space</p>
        <p class="muted"># The page you were looking for drifted out of orbit.</p>
        <br />
        <p><span class="ps1">$</span> <a href="/">cd ~</a> <span class="muted">&nbsp;# back to home</span></p>
        <p><span class="ps1">$</span> <a href="/posts/">ls ~/posts</a> <span class="muted"># browse all posts</span><span class="cursor" aria-hidden="true"></span></p>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
    <script type="text/javascript">
      (function () {
        var path = window.location.pathname;
        try { path = decodeURIComponent(path); } catch (e) {}
        $("#req-path, #req-path-2").text(path);
      })();

      $(window).on("load", function () {
        // We are listening for the window load event instead of the regular document ready.

        function animSteam() {
          // Create a new span with the steam1, or steam2 class:

          $("<span>", {
            class: "steam" + Math.floor(Math.random() * 2 + 1),
            css: {
              // Apply a random offset from 10px to the left to 10px to the right
              marginLeft: -10 + Math.floor(Math.random() * 20),
            },
          })
            .appendTo("#astronaut")
            .animate(
              {
                left: "-=58",
                bottom: "-=100",
              },
              120,
              function () {
                // When the animation completes, remove the span and
                // set the function to be run again in 10 milliseconds

                $(this).remove();
                setTimeout(animSteam, 10);
              }
            );
        }

        function moveRocket() {
          $("#astronaut")
            .animate({ left: "+=100" }, 5000)
            .delay(1000)
            .animate({ left: "-=100" }, 5000, function () {
              setTimeout(moveRocket, 1000);
            });
        }

        // Run the functions when the document and all images have been loaded.

        moveRocket();
        animSteam();
      });
    </script>
  </body>
</html>
