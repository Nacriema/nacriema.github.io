<script type="application/json" id="term-data">
{
  "user": {{ site.username | downcase | jsonify }},
  "title": {{ site.user_title | jsonify }},
  "email": {{ site.email | jsonify }},
  "github": {{ site.github_username | jsonify }},
  "linkedin": {{ site.linkedin_public_url | jsonify }},
  "baseurl": {{ site.baseurl | jsonify }},
  "posts": [
    {% for post in site.posts %}{
      "title": {{ post.title | jsonify }},
      "slug": {{ post.title | slugify | jsonify }},
      "url": {{ post.url | prepend: site.baseurl | jsonify }},
      "date": {{ post.date | date: "%Y-%m-%d" | jsonify }},
      "tags": [{% for tag in post.tags %}{{ tag | slugify | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  "projects": [
    {% for project in site.projects %}{
      "name": {{ project.name | jsonify }},
      "slug": {{ project.name | slugify | jsonify }},
      "url": {% if project.url contains 'http' %}{{ project.url | jsonify }}{% else %}{{ project.url | prepend: site.baseurl | jsonify }}{% endif %},
      "external": {% if project.url contains 'http' %}true{% else %}false{% endif %}
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
