<section class="share">

    <h3><span class="ps1">$</span> share --post</h3>

    <a aria-label="Share on X (Twitter)" href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}{% if site.twitter_username %}&via={{ site.twitter_username }}{% endif %}"
    onclick="window.open(this.href, 'twitter-share', 'width=550,height=235');return false;" title="Share on X (Twitter)">
        <svg class="icon icon-twitter"><use xlink:href="#icon-twitter"></use></svg>
    </a>

    <a aria-label="Share on Facebook" href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url }}"
    onclick="window.open(this.href, 'facebook-share','width=580,height=296');return false;" title="Share on Facebook">
        <svg class="icon icon-facebook"><use xlink:href="#icon-facebook"></use></svg>
    </a>

</section>
